parameters:
  - name: environment
    type: string

jobs:
  - job: InfraPlan_${{ parameters.environment }}
    displayName: 'What-if plan (${{ parameters.environment }})'
    pool: { vmImage: 'ubuntu-latest' }
    steps:
      - task: AzureCLI@2
        inputs:
          azureSubscription: 'azure-service-connection'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            # An unset secret variable arrives as the literal '$(name)', which
            # bicepparam would happily compile in -- fail loudly instead.
            require_secret() {
              case "$2" in
                ''|'$('*)
                  echo "##vso[task.logissue type=error]Secret variable '$1' is missing from the coaching-platform-common variable group"
                  exit 1;;
              esac
            }
            require_secret postgresAdminPassword "$POSTGRES_ADMIN_PASSWORD"
            require_secret djangoAdminPassword "$DJANGO_ADMIN_PASSWORD"
            require_secret djangoSecretKey "$DJANGO_SECRET_KEY"
            require_secret resendApiKey "$RESEND_API_KEY"
            az group create \
              --name rg-coaching-platform-${{ parameters.environment }} \
              --location "$(AZURE_LOCATION)" \
              --output none
            # Azure rejects changing an existing budget's start date, which the
            # current-month default would do in every new month. Reuse the existing
            # date; empty (no budget yet) makes main.bicep use the current month.
            SUBSCRIPTION_ID=$(az account show --query id --output tsv)
            BUDGET_URL="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/rg-coaching-platform-${{ parameters.environment }}/providers/Microsoft.Consumption/budgets/budget-coaching-platform-${{ parameters.environment }}?api-version=2023-11-01"
            BUDGET_START_DATE=$(az rest --method get --url "$BUDGET_URL" --query properties.timePeriod.startDate --output tsv 2>/dev/null | cut -c1-10)
            export BUDGET_START_DATE
            echo "Budget start date: ${BUDGET_START_DATE:-none yet, a new budget will start this month}"
            az deployment group what-if \
              --resource-group rg-coaching-platform-${{ parameters.environment }} \
              --template-file infra/azure/main.bicep \
              --parameters infra/azure/envs/${{ parameters.environment }}.bicepparam
        env:
          POSTGRES_ADMIN_PASSWORD: $(postgresAdminPassword)
          DJANGO_ADMIN_PASSWORD: $(djangoAdminPassword)
          DJANGO_SECRET_KEY: $(djangoSecretKey)
          RESEND_API_KEY: $(resendApiKey)
        displayName: 'az deployment group what-if'
