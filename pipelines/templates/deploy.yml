parameters:
  - name: environment
    type: string

steps:
  # Deployment jobs do not check out the repository by default (regular jobs
  # do), so fetch it explicitly before referencing files like main.bicep.
  - checkout: self
  - task: AzureCLI@2
    inputs:
      azureSubscription: 'azure-service-connection'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        case "$POSTGRES_ADMIN_PASSWORD" in
          ''|'$('*)
            echo "##vso[task.logissue type=error]Secret variable 'postgresAdminPassword' is missing from the coaching-platform-common variable group"
            exit 1;;
        esac
        az group create \
          --name rg-coaching-platform-${{ parameters.environment }} \
          --location "$(AZURE_LOCATION)" \
          --output none
        az deployment group create \
          --resource-group rg-coaching-platform-${{ parameters.environment }} \
          --template-file infra/azure/main.bicep \
          --parameters infra/azure/envs/${{ parameters.environment }}.bicepparam
    env:
      POSTGRES_ADMIN_PASSWORD: $(postgresAdminPassword)
    displayName: 'Deploy infrastructure (Bicep)'
  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'azure-service-connection'
      appName: 'app-coaching-platform-backend-${{ parameters.environment }}'
      package: 'generated/backend-app'
    displayName: 'Deploy backend app code'
  - task: AzureStaticWebApp@0
    inputs:
      app_location: 'generated/frontend-app'
      output_location: 'dist'
    displayName: 'Deploy frontend app code'
